version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "UTC"
    reviewers:
      - "harsharajkumar-273"
      - "sandipanxd"
    assignees:
      - "harsharajkumar-273"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      - dependency-name: "eslint"
        versions: ["8.x", "9.x"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "sunday"
      time: "04:00"
      timezone: "UTC"
    reviewers:
      - "harsharajkumar-273"
    assignees:
      - "harsharajkumar-273"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "sunday"
      time: "05:00"
      timezone: "UTC"
    reviewers:
      - "harsharajkumar-273"
    assignees:
      - "harsharajkumar-273"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"
